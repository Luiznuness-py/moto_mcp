[project]
name = "moto-mcp"
version = "0.1.0"
description = "moto_mcp como servidor MCP: expõe o próprio repositório (regras, knowledge, agentes, projetos/clientes) como tools MCP — leitura aberta, escrita restrita a projects/, clients/ e profile/. Transporte stdio (local) ou streamable-http (rede — Tailscale, LAN com token ou loopback)."
authors = [{name = "moto_mcp contributors"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
dependencies = [
    "mcp[cli] (>=1.28.0,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "lancedb (>=0.38.0,<0.39.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "uvicorn (>=0.31.1,<1.0.0)",
    "starlette (>=0.48.0,<2.0.0)",
    "httpx (>=0.27.1,<1.0.0)",
]

[tool.poetry]
packages = [{ include = "mcp_server" }]

[dependency-groups]
dev = ["pytest (>=8.0.0,<9.0.0)", "pytest-asyncio (>=0.25.0,<1.0.0)"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
