# SearXNG usado pela tool search_web.
#
# Setup:
#   copy searxng\settings.yml.example searxng\settings.yml
#   podman machine start
#   podman compose -p moto-mcp -f docker-compose.yml up -d searxng
#
# Parar:
#   podman compose -p moto-mcp -f docker-compose.yml down

name: moto-mcp

services:
  searxng:
    image: docker.io/searxng/searxng:2026.9.12-d4f00d15d
    container_name: moto-mcp-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
